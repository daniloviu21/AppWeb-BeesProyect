<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title>Métodos de pago</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <!-- Seleccionar Método de Pago Principal -->
  <ion-item>
    <ion-label>Seleccionar Método de Pago Principal</ion-label>
    <ion-select [(ngModel)]="metodoSeleccionado" (ionChange)="guardarMetodoPrincipal()">
      <ion-select-option *ngFor="let mpago of metodosPago" [value]="mpago" [disabled]="!mpago.numeroTarjeta">
        {{ mpago.tipo }} •••• {{ mpago.numeroTarjeta ? mpago.numeroTarjeta.substring(mpago.numeroTarjeta.length - 4) : '****' }}
      </ion-select-option>
    </ion-select>
  </ion-item>

  <!-- Lista de Métodos de Pago -->
  <ion-list [inset]="true">
    <ion-item *ngFor="let mpago of metodosPago">
      <img [src]="getCardImage(mpago.tipo)" alt="Card Logo" class="card-logo" />
      <ion-label>{{ mpago.tipo }}</ion-label>
      <ion-label>
        <strong>•••• </strong>
        {{ mpago.numeroTarjeta.substring(mpago.numeroTarjeta.length - 4) }}
      </ion-label>
      <ion-button fill="clear" slot="end" (click)="borrarMetodoPago(mpago)">
        <ion-icon name="trash" color="danger"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>

  <!-- Botón para Agregar Método de Pago -->
  <ion-button id="open-modal" expand="full" color="warning">
    <ion-icon slot="start" name="add-outline"></ion-icon>
    Agregar un método de pago
  </ion-button>

  <!-- Modal para Agregar Método de Pago -->
  <ion-modal trigger="open-modal" [initialBreakpoint]="0.45" [breakpoints]="[0, 0.45]">
    <ng-template>
      <ion-content class="ion-padding">
        <ion-list>
          <ion-item>
            <ion-input
              [(ngModel)]="nuevoMetodoPago.numeroTarjeta"
              placeholder="Número de tarjeta*"
              maxlength="16"
              inputmode="numeric"
              (keydown)="validateNumber($event)"
              class="custom-input"
              required
            ></ion-input>
          </ion-item>
  
          <div class="flex-container">
            <ion-item class="half-width">
              <ion-input
                [(ngModel)]="nuevoMetodoPago.fechaVencimiento"
                placeholder="MM/YY*"
                maxlength="5"
                inputmode="numeric"
                (keydown)="validateNumber($event)"
                (ionInput)="formatCaducidad($event)"
                class="custom-input"
                required
              ></ion-input>
            </ion-item>
  
            <ion-item class="half-width">
              <ion-input
                [(ngModel)]="nuevoMetodoPago.cvv"
                placeholder="CVV*"
                maxlength="3"
                inputmode="numeric"
                (keydown)="validateNumber($event)"
                class="custom-input"
                required
              ></ion-input>
            </ion-item>
          </div>
        </ion-list>
  
        <ion-button expand="block" color="warning" (click)="agregarMetodoPago()">Agregar</ion-button>
      </ion-content>
    </ng-template>
  </ion-modal>
</ion-content>
