<ion-header>
  <ion-toolbar>
    <ion-title>Editar Perfil</ion-title>
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content scroll-y="true" fullscreen="true">
  <div class="profile-container">
    <ion-avatar class="profile-avatar" (click)="mostrarOpcionesFoto()">
      <img [src]="fotoPerfil" alt="Foto de perfil">
    </ion-avatar>
    <input type="file" #fileInput (change)="cargarImagen($event)" hidden>
  </div>

  <ion-list>
    <ion-item>
      <ion-label position="floating">Usuario</ion-label>
      <ion-input [(ngModel)]="usuario" [disabled]="!modoEdicion"></ion-input>
    </ion-item>

    <ion-item [class.error-input]="errores['nombre']">
      <ion-label position="floating">Nombre</ion-label>
      <ion-input [(ngModel)]="nombreCliente" [disabled]="!modoEdicion"></ion-input>
    </ion-item>

    <ion-item [class.error-input]="errores['apellidoP']">
      <ion-label position="floating">Apellido Paterno</ion-label>
      <ion-input [(ngModel)]="apellidoP" [disabled]="!modoEdicion"></ion-input>
    </ion-item>

    <ion-item [class.error-input]="errores['apellidoM']">
      <ion-label position="floating">Apellido Materno</ion-label>
      <ion-input [(ngModel)]="apellidoM" [disabled]="!modoEdicion"></ion-input>
    </ion-item>

    <ion-item [class.error-input]="errores['telefono']">
      <ion-label position="floating">Teléfono</ion-label>
      <ion-input [(ngModel)]="telefono" (ionInput)="validarTelefono($event)" [disabled]="!modoEdicion" type="tel"></ion-input>
    </ion-item>

    <ion-item [class.error-input]="errores['correo']">
      <ion-label position="floating">Correo Electrónico</ion-label>
      <ion-input [(ngModel)]="correo" [disabled]="!modoEdicion" type="email"></ion-input>
    </ion-item>
  </ion-list>

  <div class="button-group">
    <ion-button expand="full" (click)="habilitarEdicion()" *ngIf="!modoEdicion">Editar</ion-button>
    <ion-button expand="full" color="success" (click)="guardarPerfil()" *ngIf="modoEdicion">Guardar</ion-button>
  </div>
</ion-content>
