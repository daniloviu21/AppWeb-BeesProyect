<ion-header>
  <ion-toolbar>
    <ion-title>Editar Perfil</ion-title>
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content scroll-y="true" fullscreen="true">
  <div *ngIf="!cargando; else loading" class="profile-container">
    <ion-avatar class="profile-avatar" (click)="mostrarOpcionesFoto()">
      <img [src]="fotoPerfil" alt="Foto de perfil">
    </ion-avatar>
    <input type="file" #fileInput (change)="cargarImagen($event)" hidden accept="image/*">
  </div>

  <ion-list *ngIf="!cargando">
    <ion-item>
      <ion-label position="floating">Nombre</ion-label>
      <ion-input 
        [(ngModel)]="nombreCliente" 
        (ionChange)="onInputChange()"
        type="text"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Apellido Paterno</ion-label>
      <ion-input 
        [(ngModel)]="apellidoP" 
        (ionChange)="onInputChange()"
        type="text"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Apellido Materno</ion-label>
      <ion-input 
        [(ngModel)]="apellidoM" 
        (ionChange)="onInputChange()"
        type="text"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Teléfono</ion-label>
      <ion-input 
        [(ngModel)]="telefono" 
        (ionInput)="validarTelefono($event)"
        (ionChange)="onInputChange()"
        type="tel"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Correo Electrónico</ion-label>
      <ion-input 
        [(ngModel)]="correo" 
        (ionChange)="onInputChange()"
        type="email"></ion-input>
    </ion-item>
  </ion-list>

  <div *ngIf="!cargando" class="button-group">
    <ion-button 
      expand="full" 
      color="success" 
      (click)="guardarCambios()" 
      [disabled]="!cambiosRealizados">
      Guardar Cambios
    </ion-button>
  </div>

  <ng-template #loading>
    <div class="loading-container">
      <ion-spinner></ion-spinner>
      <p>Cargando datos...</p>
    </div>
  </ng-template>
</ion-content>
